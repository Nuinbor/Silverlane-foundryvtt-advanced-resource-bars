name: Package release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Verify tag matches manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node --input-type=module -e 'import fs from "node:fs"; if (`v${JSON.parse(fs.readFileSync("module.json")).version}` !== process.env.RELEASE_TAG) process.exit(1);'
      - run: npm run build
      - name: Publish archive and manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/silverlane-resource-bars.zip dist/module.json --title "$GITHUB_REF_NAME" --generate-notes
